[package]
name = "loginctl"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.89"
description = "Unified administration for the decoupled login stack"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
dbus = "0.9.12"
uuid = "1"
libc = "0.2.191"
lib-scoped = { version = "=0.2.0", git = "https://github.com/shaitan-machine1/sessiond.git", rev = "7b2038f3bc43c3c1c9ba030762672668a69b3f66" }
lib-sessiond = { version = "=0.2.0", git = "https://github.com/shaitan-machine1/sessiond.git", rev = "7b2038f3bc43c3c1c9ba030762672668a69b3f66", default-features = false, features = ["blocking-client"] }
lib-multiseatd = { git = "https://github.com/shaitan-machine1/multiseatd.git", tag = "v0.4.0" }
seat-udev = { git = "https://github.com/shaitan-machine1/multiseatd.git", tag = "v0.4.0", features = ["assign"] }

[dev-dependencies]
dbus-crossroads = "0.5.3"
tempfile = "3.26.0"
