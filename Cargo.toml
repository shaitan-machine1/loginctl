[package]
name = "loginctl"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.89"
description = "Unified administration for the decoupled login stack"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
dbus = "0.9.12"
uuid = "1"
libc = "0.2.191"
lib-scoped = { path = "../sessiond/crates/lib-scoped" }
lib-sessiond = { path = "../sessiond/crates/lib-sessiond" }
lib-multiseatd = { git = "https://github.com/shaitan-machine1/multiseat.git", tag = "v0.2.0" }
seat-udev = { git = "https://github.com/shaitan-machine1/multiseat.git", tag = "v0.2.0", features = ["assign"] }

[dev-dependencies]
dbus-crossroads = "0.5.3"
tempfile = "3.26.0"
